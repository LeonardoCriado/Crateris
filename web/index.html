<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crateris — Forecasts TimesFM-3</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; background: #111; color: #eee; }
  select { font-size: 1rem; padding: .4rem; background: #222; color: #eee; border: 1px solid #444; }

  .card b { display: block; font-size: 1.2rem; }
  .meta { color: #999; font-size: .85rem; margin-top: 1rem; }
  #unavailable { color: #f66; }
</style>
</head>
<body>
<h1>Crateris — forecasts zero-shot con TimesFM-3</h1>
<label>Dataset: <select id="ds"></select></label>
<div id="chart"></div>
<div class="cards" id="cards"></div>
<p class="meta" id="meta"></p>
<p id="unavailable"></p>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="main.js"></script>
